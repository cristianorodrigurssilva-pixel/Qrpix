<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrPix</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#32BCAD">
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/thumb/0/03/Logo_do_Pix.svg/1200px-Logo_do_Pix.svg.png">

    <!-- Biblioteca QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 25px; border-radius: 12px; max-width: 450px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #333; margin-bottom: 20px; text-align: center; }
        label { font-size: 14px; font-weight: bold; color: #555; display: block; margin-top: 12px; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { width: 100%; padding: 14px; background-color: #32BCAD; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 18px; cursor: pointer; }
        button:hover { background-color: #28998c; }
        .btn-whatsapp { background-color: #25d366; margin-top: 10px; }
        .btn-whatsapp:hover { background-color: #1eb954; }
        /* Botão de instalação */
        #btn-instalar { background-color: #555; display: none; }
        #qrcode-container { margin-top: 20px; display: flex; justify-content: center; }
        .result-box { display: none; margin-top: 20px; }
        textarea { width: 100%; height: 80px; margin-top: 8px; padding: 10px; border-radius: 6px; border: 1px solid #ccc; font-family: monospace; font-size: 12px; resize: none; background: #f9f9f9; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>QrPix</h1>

    <label for="chave">Chave Pix:</label>
    <input type="text" id="chave" placeholder="CPF, CNPJ, E-mail, Celular ou Aleatória">

    <label for="nome">Nome do Recebedor:</label>
    <input type="text" id="nome" placeholder="Ex: Cristiano Silva">

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" placeholder="Ex: Fortaleza">

    <label for="valor">Valor (R$) (Opcional):</label>
    <input type="text" id="valor" placeholder="0,00" inputmode="numeric">

    <button type="button" onclick="gerarPix()">Gerar QR Code</button>

    <!-- Botão de Instalação -->
    <button type="button" id="btn-instalar">Instalar App no Celular</button>

    <div id="result" class="result-box">
        <div id="qrcode-container"></div>
        
        <label for="pix-payload">Código Pix Copia e Cola:</label>
        <textarea id="pix-payload" readonly></textarea>
        
        <button type="button" onclick="copiarPix()">Copiar Código Pix</button>
        <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar no WhatsApp</button>
    </div>
</div>

<script>
// 1. Persistência de Dados (localStorage)
document.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('pix_chave')) document.getElementById('chave').value = localStorage.getItem('pix_chave');
    if (localStorage.getItem('pix_nome')) document.getElementById('nome').value = localStorage.getItem('pix_nome');
    if (localStorage.getItem('pix_cidade')) document.getElementById('cidade').value = localStorage.getItem('pix_cidade');

    document.getElementById('chave').addEventListener('input', function(e) {
        localStorage.setItem('pix_chave', e.target.value);
    });
    document.getElementById('nome').addEventListener('input', function(e) {
        localStorage.setItem('pix_nome', e.target.value);
    });
    document.getElementById('cidade').addEventListener('input', function(e) {
        localStorage.setItem('pix_cidade', e.target.value);
    });
});

// 2. Registro do Service Worker (PWA)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('SW registrado.');
        }).catch(function(err) {
            console.log('Erro no SW:', err);
        });
    });
}

// 3. Lógica para instalação do App
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btn-instalar').style.display = 'block';
});

document.getElementById('btn-instalar').addEventListener('click', (e) => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            deferredPrompt = null;
        });
    }
});

// 4. Máscara de Moeda
document.getElementById('valor').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (!v) { e.target.value = ''; return; }
    v = (parseInt(v, 10) / 100).toFixed(2);
    v = v.replace('.', ',');
    v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
    e.target.value = v;
});

// 5. Algoritmo Pix
function CRC16(str) {
    let crc = 0xFFFF;
    for (let c = 0; c < str.length; c++) {
        crc ^= str.charCodeAt(c) << 8;
        for (let i = 0; i < 8; i++) {
            if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
            else crc = crc << 1;
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function formatField(id, value) {
    const len = value.length.toString().padStart(2, '0');
    return id + len + value;
}

function gerarPix() {
    const chave = document.getElementById('chave').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const cidade = document.getElementById('cidade').value.trim();
    let valor = document.getElementById('valor').value.replace(/\./g, '').replace(',', '.').trim();

    if (!chave || !nome || !cidade) {
        alert('Por favor, preencha a chave Pix, o nome e a cidade.');
        return;
    }

    let merchantAccount = formatField('00', 'BR.GOV.BCB.PIX') + formatField('01', chave);
    let payload = formatField('00', '01') + formatField('26', merchantAccount) + formatField('52', '0000') + formatField('53', '986');

    if (valor && !isNaN(valor) && parseFloat(valor) > 0) {
        payload += formatField('54', parseFloat(valor).toFixed(2));
    }

    payload += formatField('58', 'BR') + formatField('59', nome.substring(0, 25)) + formatField('60', cidade.substring(0, 15)) + formatField('62', formatField('05', '***')) + '6304';

    const crc = CRC16(payload);
    const pixCompleto = payload + crc;

    document.getElementById('pix-payload').value = pixCompleto;
    document.getElementById('qrcode-container').innerHTML = '';

    new QRCode(document.getElementById('qrcode-container'), { text: pixCompleto, width: 180, height: 180 });
    document.getElementById('result').style.display = 'block';
}

// Cópia automática ao clicar na caixa de texto
document.getElementById('pix-payload').addEventListener('click', function() {
    this.select();
    this.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(this.value);
    alert('Código Pix copiado! Cole no app do seu banco na opção Pix Copia e Cola.');
});

// Botão Copiar
function copiarPix() {
    const payloadInput = document.getElementById('pix-payload');
    payloadInput.select();
    payloadInput.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(payloadInput.value);
    alert('Código Pix copiado! Cole no app do seu banco na opção Pix Copia e Cola.');
}

// Envio para o WhatsApp com o texto formatado para cópia rápida
function enviarWhatsApp() {
    const pixCode = document.getElementById('pix-payload').value;
    if (!pixCode) return;

    const textoEnvio = `${pixCode}\n\n(Código Pix Copia e Cola. Toque no código para copiar e cole no app do seu banco)`;

    if (navigator.share) {
        navigator.share({
            text: textoEnvio
        }).catch(() => {
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoEnvio)}`;
            window.open(url, '_blank');
        });
    } else {
        const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(textoEnvio)}`;
        window.open(url, '_blank');
    }
}
</script>

</body>
</html>
