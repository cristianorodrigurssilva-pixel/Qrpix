<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#00a884">

<link rel="manifest" href="manifest.json">

<title>QrPix</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f5f4;
    color: #17211f;
}

header {
    background: #00a884;
    color: white;
    padding: 18px;
    text-align: center;
}

.logo {
    font-size: 30px;
    font-weight: bold;
}

.container {
    max-width: 680px;
    margin: 20px auto;
    padding: 0 15px;
}

.card {
    background: white;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 14px #00000015;
}

h2 {
    margin-top: 0;
}

label {
    display: block;
    font-weight: bold;
    margin-top: 14px;
    margin-bottom: 6px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ccd6d2;
    border-radius: 10px;
    font-size: 16px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.primary {
    width: 100%;
    margin-top: 18px;
    background: #00a884;
    color: white;
}

.secondary {
    background: #e7f5f1;
    color: #007d64;
}

.whatsapp {
    background: #25d366;
    color: white;
}

.actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
}

#qrcode {
    display: flex;
    justify-content: center;
    margin: 20px 0;
}

#qrcode img {
    max-width: 100%;
}

.codebox {
    background: #f4f7f6;
    border: 1px dashed #aebcb8;
    border-radius: 10px;
    padding: 12px;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
}

.hidden {
    display: none;
}

.status {
    text-align: center;
    margin-top: 12px;
}

.saved {
    background: #f0faf7;
    padding: 10px;
    border-radius: 10px;
    margin-top: 10px;
    font-size: 13px;
}

.note {
    color: #687773;
    font-size: 13px;
    line-height: 1.5;
}

footer {
    text-align: center;
    color: #71807c;
    font-size: 12px;
    padding: 20px;
}

@media(max-width:500px) {

    .actions {
        grid-template-columns: 1fr;
    }

    .card {
        padding: 16px;
    }

}

</style>
</head>

<body>

<header>

<div class="logo">▣ QrPix</div>

<div>Gerador de Pix</div>

</header>


<main class="container">

<section class="card">

<h2>Dados do Pix</h2>


<label>Chave Pix</label>

<input
id="chave"
placeholder="CPF, CNPJ, celular, e-mail ou chave aleatória"
>


<label>Nome do recebedor</label>

<input
id="nome"
maxlength="25"
placeholder="Nome"
>


<label>Cidade</label>

<input
id="cidade"
maxlength="15"
placeholder="Cidade"
>


<label>Valor</label>

<input
id="valor"
inputmode="decimal"
placeholder="R$ 0,00"
>


<button
class="primary"
onclick="gerarPix()"
>

Gerar QR Code Pix

</button>


<div
id="salvo"
class="saved hidden"
>
✓ Dados salvos neste aparelho.
</div>


<p class="note">

A chave Pix, nome e cidade ficam salvos neste aparelho.

</p>

</section>


<section
id="resultado"
class="card hidden"
>

<h2>Pix gerado</h2>


<div id="qrcode"></div>


<div
id="payload"
class="codebox"
></div>


<div class="actions">

<button
class="secondary"
onclick="copiarPix()"
>

Copiar código

</button>


<button
class="whatsapp"
onclick="compartilharWhatsApp()"
>

WhatsApp

</button>

</div>


<div
id="status"
class="status"
></div>

</section>

</main>


<footer>

QrPix • Gerador de Pix

</footer>


<script>

const chave =
document.getElementById("chave");

const nome =
document.getElementById("nome");

const cidade =
document.getElementById("cidade");

const valor =
document.getElementById("valor");


/* =========================
   SALVAR DADOS
========================= */

function salvarDados() {

localStorage.setItem(
"qrpix_chave",
chave.value
);

localStorage.setItem(
"qrpix_nome",
nome.value
);

localStorage.setItem(
"qrpix_cidade",
cidade.value
);

document
.getElementById("salvo")
.classList.remove("hidden");

}


/* =========================
   CARREGAR DADOS
========================= */

window.onload = function() {

chave.value =
localStorage.getItem("qrpix_chave") || "";

nome.value =
localStorage.getItem("qrpix_nome") || "";

cidade.value =
localStorage.getItem("qrpix_cidade") || "";

};


/* =========================
   MÁSCARA DE MOEDA
========================= */

valor.addEventListener(
"input",
function() {

let numeros =
this.value.replace(/\D/g,"");

if (!numeros) {

this.value = "";

return;

}

let numero =
parseInt(numeros) / 100;

this.value =
numero.toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

});


/* =========================
   CRC16
========================= */

function crc16(str) {

let crc = 0xFFFF;

for (
let i = 0;
i < str.length;
i++
) {

crc ^=
str.charCodeAt(i) << 8;

for (
let j = 0;
j < 8;
j++
) {

if (
crc & 0x8000
) {

crc =
(crc << 1) ^
0x1021;

} else {

crc =
crc << 1;

}

crc &=
0xFFFF;

}

}

return crc
.toString(16)
.toUpperCase()
.padStart(4,"0");

}


/* =========================
   CAMPO PIX
========================= */

function campo(id, valor) {

return (
id +
String(valor.length)
.padStart(2,"0") +
valor
);

}


/* =========================
   GERAR PIX
========================= */

function gerarPix() {

if (
!chave.value ||
!nome.value ||
!cidade.value
) {

document.getElementById(
"status"
).innerText =
"Preencha a chave, nome e cidade.";

return;

}


salvarDados();


let chavePix =
chave.value.trim();


let nomePix =
nome.value
.trim()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toUpperCase()
.substring(0,25);


let cidadePix =
cidade.value
.trim()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.toUpperCase()
.substring(0,15);


/* CONTA DO RECEBEDOR */

let gui =
campo(
"00",
"br.gov.bcb.pix"
);

let chaveCampo =
campo(
"01",
chavePix
);

let merchant =
campo(
"26",
gui + chaveCampo
);


/* PAYLOAD */

let pix =
campo("00","01") +
merchant +
campo("52","0000") +
campo("53","986");


/* VALOR */

let valorTexto =
valor.value
.replace("R$","")
.replace(/\./g,"")
.replace(",",".")
.trim();


let valorNumero =
parseFloat(valorTexto);


if (
!isNaN(valorNumero) &&
valorNumero > 0
) {

pix +=
campo(
"54",
valorNumero.toFixed(2)
);

}


pix +=
campo("58","BR");

pix +=
campo("59",nomePix);

pix +=
campo("60",cidadePix);


/* IDENTIFICADOR */

pix +=
campo(
"62",
campo("05","***")
);


/* CRC */

pix += "6304";

pix += crc16(pix);


/* MOSTRAR */

document.getElementById(
"payload"
).innerText = pix;


document.getElementById(
"qrcode"
).innerHTML = "";


new QRCode(
document.getElementById("qrcode"),
{
text: pix,
width: 280,
height: 280
}
);


document
.getElementById("resultado")
.classList.remove("hidden");


document.getElementById(
"status"
).innerText =
"QR Code gerado com sucesso!";


document
.getElementById("resultado")
.scrollIntoView({
behavior:"smooth"
});

}


/* =========================
   COPIAR
========================= */

function copiarPix() {

let codigo =
document.getElementById(
"payload"
).innerText;


navigator.clipboard
.writeText(codigo)
.then(function() {

document.getElementById(
"status"
).innerText =
"✓ Código Pix copiado!";

});

}


/* =========================
   WHATSAPP
========================= */

function compartilharWhatsApp() {

let codigo =
document.getElementById(
"payload"
).innerText;


let mensagem =
"Olá! Segue o Pix para pagamento.%0A%0A" +
"Copia e Cola:%0A" +
encodeURIComponent(codigo);


window.open(
"https://wa.me/?text=" +
mensagem,
"_blank"
);

}

</script>


</body>

</html>
