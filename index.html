<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrPix</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#32BCAD">
    <link rel="icon" type="image/svg+xml" href="./icon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background-color: #f4f6f9; padding: 20px; font-family: sans-serif; display: flex; justify-content: center; }
        .container { background: #ffffff; padding: 20px; border-radius: 12px; max-width: 400px; width: 100%; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #32BCAD; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-whatsapp { background: #25d366; }
        #qrcode-container { margin-top: 20px; display: flex; justify-content: center; }
        .result-box { display: none; }
        textarea { width: 100%; height: 60px; margin-top: 10px; padding: 5px; font-family: monospace; font-size: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>QrPix</h1>
    <input type="text" id="chave" placeholder="Chave Pix (CPF, Celular, Email)">
    <input type="text" id="nome" placeholder="Nome do Recebedor">
    <input type="text" id="cidade" placeholder="Cidade">
    <input type="text" id="valor" placeholder="Valor (0,00)">
    <button onclick="gerarPix()">Gerar QR Code</button>
    <button id="btn-instalar" style="display:none; background:#555;">Instalar App</button>
    <div id="result" class="result-box">
        <div id="qrcode-container"></div>
        <textarea id="pix-payload" readonly></textarea>
        <button onclick="copiarPix()">Copiar Código</button>
        <button class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar WhatsApp</button>
    </div>
</div>

<script>
// PWA
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js'); }
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('btn-instalar').style.display = 'block'; });
document.getElementById('btn-instalar').addEventListener('click', () => { deferredPrompt.prompt(); });

// Validação e Gerador
function formatField(id, value) { return id + value.length.toString().padStart(2, '0') + value; }

function CRC16(str) {
    let crc = 0xFFFF;
    for (let c = 0; c < str.length; c++) {
        crc ^= (str.charCodeAt(c) & 0xFF) << 8;
        for (let i = 0; i < 8; i++) {
            crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) : (crc << 1);
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function gerarPix() {
    let chave = document.getElementById('chave').value.replace(/[^a-zA-Z0-9@.]/g, '');
    let nome = document.getElementById('nome').value.toUpperCase().substring(0, 25);
    let cidade = document.getElementById('cidade').value.toUpperCase().substring(0, 15);
    let valor = document.getElementById('valor').value.replace(',', '.');

    // Montagem EMV (Simplificada e robusta)
    let merchant = formatField('00', 'BR.GOV.BCB.PIX') + formatField('01', chave);
    let payload = '000201' + formatField('26', merchant) + '520400005303986';
    if(valor) payload += formatField('54', parseFloat(valor).toFixed(2));
    payload += '5802BR' + formatField('59', nome) + formatField('60', cidade) + '62070503***6304';
    
    let full = payload + CRC16(payload);
    document.getElementById('pix-payload').value = full;
    document.getElementById('result').style.display = 'block';
    document.getElementById('qrcode-container').innerHTML = '';
    new QRCode(document.getElementById('qrcode-container'), { text: full, width: 200, height: 200 });
}

function copiarPix() { navigator.clipboard.writeText(document.getElementById('pix-payload').value); alert('Copiado!'); }
function enviarWhatsApp() { 
    let text = "Pix R$ " + document.getElementById('valor').value + "\n\n" + document.getElementById('pix-payload').value;
    window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(text)); 
}
</script>
</body>
</html>
