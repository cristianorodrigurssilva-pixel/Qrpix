<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#13899C">
  <title>QrPix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f8; padding: 20px; display: flex; justify-content: center; }
    .container { background: #ffffff; padding: 25px; border-radius: 12px; max-width: 400px; width: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
    h1 { color: #13899C; margin-bottom: 20px; font-size: 24px; }
    label { display: block; text-align: left; font-weight: bold; margin: 10px 0 5px; color: #333; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; margin-bottom: 10px; }
    button { width: 100%; padding: 12px; background-color: #13899C; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    button:active { background-color: #0e6877; }
    #qrcode { margin-top: 20px; display: flex; justify-content: center; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Gerador QrPix</h1>
    
    <label for="chave">Chave PIX:</label>
    <input type="text" id="chave" placeholder="CPF, CNPJ, E-mail ou Tel">
    
    <label for="valor">Valor (Opcional):</label>
    <input type="number" id="valor" step="0.01" placeholder="0.00">
    
    <button onclick="gerarQR()">Gerar QR Code</button>

    <div id="qrcode"></div>
  </div>

  <script>
    // Gerador de QR Code
    function gerarQR() {
      const chave = document.getElementById('chave').value.trim();
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = "";

      if (!chave) {
        alert("Por favor, digite uma chave PIX.");
        return;
      }

      new QRCode(qrContainer, {
        text: chave,
        width: 200,
        height: 200
      });
    }

    // REGISTRO DO SERVICE WORKER (Para funcionamento 100% Offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker ativado!', reg.scope))
          .catch((err) => console.error('Erro ao registrar SW:', err));
      });
    }
  </script>
</body>
</html>
