<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QrPix</title>
    
    <!-- Configurações PWA -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#7C3AED">
    <!-- Ícone apontando para o arquivo SVG com ?v=2 para atualizar o cache do navegador e do PWA -->
    <link rel="icon" type="image/svg+xml" href="./icon.svg?v=2">

    <!-- Biblioteca QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
        
        /* Fundo da Tela: Lilás Suave Alegre */
        body { 
            background: linear-gradient(135deg, #f3e8ff 0%, #e0e7ff 100%); 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
        }
        
        /* Container claro com sombra colorida sutil */
        .container { 
            background: #ffffff; 
            padding: 25px; 
            border-radius: 20px; 
            max-width: 450px; 
            width: 100%; 
            box-shadow: 0 12px 30px rgba(124, 58, 237, 0.12); 
            border: 1px solid #e9d5ff;
        }
        
        /* Título Roxo Vivo com 'Pix' em Turquesa Elétrico */
        h1 { 
            font-size: 30px; 
            font-weight: 800; 
            color: #6b21a8; 
            margin-bottom: 20px; 
            text-align: center;
            letter-spacing: 0.5px;
        }
        .pix-color {
            color: #00d2b8; /* Turquesa / Ciano Elétrico */
        }

        /* Textos e Rótulos em Roxo Escuro Legível */
        label { font-size: 14px; font-weight: 700; color: #4c1d95; display: block; margin-top: 14px; }
        
        /* Campos de texto com borda e foco em Violeta */
        input { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            border: 2px solid #e9d5ff; 
            border-radius: 10px; 
            font-size: 16px; 
            background: #faf5ff; 
            color: #3b0764;
            transition: all 0.2s;
        }
        input:focus {
            outline: none;
            border-color: #8b5cf6;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.18);
        }

        /* Botão Principal: Violeta Vibrante */
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #7c3aed; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            margin-top: 20px; 
            cursor: pointer; 
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background-color: #6d28d9; }
        button:active { transform: scale(0.99); }
        
        .btn-whatsapp { background-color: #25d366; color: white; margin-top: 10px; }
        .btn-whatsapp:hover { background-color: #1eb954; }
        
        /* Botão de instalação em Laranja / Coral Vivo */
        #btn-instalar { background-color: #f97316; color: white; display: none; }
        #btn-instalar:hover { background-color: #ea580c; }
        
        #qrcode-container { 
            margin-top: 20px; 
            display: flex; 
            justify-content: center; 
            background: #ffffff; 
            padding: 12px;
            border-radius: 12px;
            border: 1px dashed #c084fc;
        }
        
        .result-box { display: none; margin-top: 20px; }
        
        textarea { 
            width: 100%; 
            height: 85px; 
            margin-top: 8px; 
            padding: 10px; 
            border-radius: 10px; 
            border: 2px solid #e9d5ff; 
            font-family: monospace; 
            font-size: 12px; 
            resize: none; 
            background: #faf5ff; 
            color: #3b0764;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Qr<span class="pix-color">Pix</span></h1>

    <label for="chave">Chave Pix:</label>
    <input type="text" id="chave" placeholder="CPF, CNPJ, E-mail, Celular ou Aleatória">

    <label for="nome">Nome do Recebedor:</label>
    <input type="text" id="nome" placeholder="Seu Nome">

    <label for="cidade">Cidade:</label>
    <input type="text" id="cidade" placeholder="Sua Cidade">

    <label for="valor">Valor (R$) (Opcional):</label>
    <input type="text" id="valor" placeholder="0,00" inputmode="numeric">

    <button type="button" onclick="gerarPix()">Gerar QR Code</button>

    <!-- Botão de Instalação -->
    <button type="button" id="btn-instalar">Instalar App no Celular</button>

    <div id="result" class="result-box">
        <div id="qrcode-container"></div>
        
        <label for="pix-payload">Código Pix Copia e Cola:</label>
        <textarea id="pix-payload" readonly></textarea>
        
        <button type="button" onclick="copiarPix()">Copiar Código Pix</button>
        <button type="button" class="btn-whatsapp" onclick="enviarWhatsApp()">Enviar no WhatsApp</button>
    </div>
</div>

<script>
// 1. Persistência de Dados (localStorage)
document.addEventListener('DOMContentLoaded', function() {
    if (localStorage.getItem('pix_chave')) document.getElementById('chave').value = localStorage.getItem('pix_chave');
    if (localStorage.getItem('pix_nome')) document.getElementById('nome').value = localStorage.getItem('pix_nome');
    if (localStorage.getItem('pix_cidade')) document.getElementById('cidade').value = localStorage.getItem('pix_cidade');

    document.getElementById('chave').addEventListener('input', function(e) {
        localStorage.setItem('pix_chave', e.target.value);
    });
    document.getElementById('nome').addEventListener('input', function(e) {
        localStorage.setItem('pix_nome', e.target.value);
    });
    document.getElementById('cidade').addEventListener('input', function(e) {
        localStorage.setItem('pix_cidade', e.target.value);
    });

    document.getElementById('pix-payload').addEventListener('click', function() {
        copiarPix();
    });
});

// 2. Registro do Service Worker (PWA)
if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').then(function(reg) {
            console.log('SW registrado.');
        }).catch(function(err) {
            console.log('Erro no SW:', err);
        });
    });
}

// 3. Lógica para instalação do App
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('btn-instalar').style.display = 'block';
});

document.getElementById('btn-instalar').addEventListener('click', (e) => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then((choiceResult) => {
            deferredPrompt = null;
        });
    }
});

// 4. Máscara de Moeda
document.getElementById('valor').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (!v) { e.target.value = ''; return; }
    v = (parseInt(v, 10) / 100).toFixed(2);
    v = v.replace('.', ',');
    v = v.replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
    e.target.value = v;
});

// 5. Algoritmo Pix
function CRC16(str) {
    let crc = 0xFFFF;
    for (let c = 0; c < str.length; c++) {
        crc ^= str.charCodeAt(c) << 8;
        for (let i = 0; i < 8; i++) {
            if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
            else crc = crc << 1;
        }
    }
    return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
}

function formatField(id, value) {
    const len = value.length.toString().padStart(2, '0');
    return id + len + value;
}

function gerarPix() {
    const chave = document.getElementById('chave').value.trim();
    const nome = document.getElementById('nome').value.trim();
    const cidade = document.getElementById('cidade').value.trim();
    let valor = document.getElementById('valor').value.replace(/\./g, '').replace(',', '.').trim();

    if (!chave || !nome || !cidade) {
        alert('Por favor, preencha a chave Pix, o nome e a cidade.');
        return;
    }

    let merchantAccount = formatField('00', 'BR.GOV.BCB.PIX') + formatField('01', chave);
    let payload = formatField('00', '01') + formatField('26', merchantAccount) + formatField('52', '0000') + formatField('53', '986');

    if (valor && !isNaN(valor) && parseFloat(valor) > 0) {
        payload += formatField('54', parseFloat(valor).toFixed(2));
    }

    payload += formatField('58', 'BR') + formatField('59', nome.substring(0, 25)) + formatField('60', cidade.substring(0, 15)) + formatField('62', formatField('05', '***')) + '6304';

    const crc = CRC16(payload);
    const pixCompleto = payload + crc;

    document.getElementById('pix-payload').value = pixCompleto;
    document.getElementById('qrcode-container').innerHTML = '';

    new QRCode(document.getElementById('qrcode-container'), { text: pixCompleto, width: 180, height: 180 });
    document.getElementById('result').style.display = 'block';
}

function copiarPix() {
    const payloadInput = document.getElementById('pix-payload');
    if (!payloadInput.value) return;

    payloadInput.focus();
    payloadInput.select();
    payloadInput.setSelectionRange(0, 99999);

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(payloadInput.value).then(function() {
            alert('Código Pix copiado!');
        }).catch(function() {
            document.execCommand('copy');
            alert('Código Pix copiado!');
        });
    } else {
        document.execCommand('copy');
        alert('Código Pix copiado!');
    }
}

function enviarWhatsApp() {
    const pixCode = document.getElementById('pix-payload').value;
    if (!pixCode) return;
    const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(pixCode)}`;
    window.open(url, '_blank');
}
</script>

</body>
</html>
