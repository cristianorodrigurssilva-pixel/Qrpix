<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#13899C">
  <title>QrPix</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-512.png" type="image/png">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #0e6877, #13899C); min-height: 100vh; padding: 20px; display: flex; justify-content: center; align-items: center; }
    .card { background: #ffffff; padding: 25px; border-radius: 16px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    h1 { color: #13899C; text-align: center; margin-bottom: 20px; font-size: 26px; font-weight: 700; }
    .input-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; color: #444; font-size: 14px; }
    input, select { width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
    input:focus, select:focus { border-color: #13899C; outline: none; }
    .btn { width: 100%; padding: 14px; background: #13899C; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: background 0.3s; }
    .btn:hover { background: #0e6877; }
    .btn-wsp { background: #25D366; margin-top: 8px; }
    .btn-wsp:hover { background: #1da851; }
    .btn-copy { background: #555; margin-top: 8px; }
    .btn-copy:hover { background: #333; }
    #qrcode { margin-top: 20px; display: flex; justify-content: center; padding: 15px; background: #f9f9f9; border-radius: 8px; }
    .actions { display: none; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>QrPix</h1>
    
    <div class="input-group">
      <label for="tipoChave">Tipo de Chave:</label>
      <select id="tipoChave">
        <option value="cpf">CPF / CNPJ</option>
        <option value="email">E-mail</option>
        <option value="telefone">Telefone</option>
        <option value="aleatoria">Chave Aleatória</option>
      </select>
    </div>

    <div class="input-group">
      <label for="chave">Chave PIX:</label>
      <input type="text" id="chave" placeholder="Digite sua chave aqui">
    </div>
    
    <div class="input-group">
      <label for="valor">Valor (R$):</label>
      <input type="number" id="valor" step="0.01" placeholder="0,00 (Opcional)">
    </div>
    
    <button class="btn" onclick="gerarQR()">Gerar QR Code</button>

    <div id="qrcode"></div>

    <div id="actions" class="actions">
      <button class="btn btn-copy" onclick="copiarPix()">Copiar Chave Pix</button>
      <button class="btn btn-wsp" onclick="enviarWhatsapp()">Enviar por WhatsApp</button>
    </div>
  </div>

  <script>
    function gerarQR() {
      const chave = document.getElementById('chave').value.trim();
      const valor = document.getElementById('valor').value;
      const qrContainer = document.getElementById('qrcode');
      const actionsDiv = document.getElementById('actions');
      
      qrContainer.innerHTML = "";

      if (!chave) {
        alert("Por favor, informe a sua chave PIX.");
        actionsDiv.style.display = "none";
        return;
      }

      new QRCode(qrContainer, {
        text: chave,
        width: 220,
        height: 220,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      actionsDiv.style.display = "block";
    }

    function copiarPix() {
      const chave = document.getElementById('chave').value.trim();
      if (chave) {
        navigator.clipboard.writeText(chave);
        alert("Chave Pix copiada para a área de transferência!");
      }
    }

    function enviarWhatsapp() {
      const chave = document.getElementById('chave').value.trim();
      const valor = document.getElementById('valor').value;
      
      if (!chave) return;

      let mensagem = `Olá! Segue minha chave Pix para pagamento:\n\n*Chave Pix:* ${chave}`;
      if (valor) {
        mensagem += `\n*Valor:* R$ ${parseFloat(valor).toFixed(2)}`;
      }

      const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensagem)}`;
      window.open(url, '_blank');
    }

    // REGISTRO DO SERVICE WORKER (Funcionamento Offline)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker ativo!', reg.scope))
          .catch((err) => console.error('Erro no SW:', err));
      });
    }
  </script>
</body>
</html>
