<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#32BCAD" />
      <stop offset="100%" stop-color="#1E9688" />
    </linearGradient>
  </defs>

  <!-- Fundo Turquesa -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Cartão Branco Central -->
  <rect x="96" y="80" width="320" height="320" rx="40" fill="#FFFFFF" />

  <!-- Símbolo QR Code Minimalista -->
  <path d="M 156 140 h 60 v 60 h -60 z M 296 140 h 60 v 60 h -60 z M 156 280 h 60 v 60 h -60 z" fill="#1A202C"/>
  <path d="M 176 160 h 20 v 20 h -20 z M 316 160 h 20 v 20 h -20 z M 176 300 h 20 v 20 h -20 z" fill="#32BCAD"/>
  
  <!-- Detalhes do QR -->
  <rect x="296" y="280" width="25" height="25" rx="4" fill="#32BCAD"/>
  <rect x="331" y="315" width="25" height="25" rx="4" fill="#1A202C"/>
  <rect x="256" y="140" width="20" height="60" rx="4" fill="#32BCAD"/>
  <rect x="256" y="240" width="60" height="20" rx="4" fill="#1A202C"/>

  <!-- Texto QrPix na base -->
  <text x="50%" y="450" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">QrPix</text>
</svg>
