<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradiente Verde Pix -->
    <linearGradient id="pixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32BCAD" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- Fundo Escuro Moderno -->
  <rect width="512" height="512" rx="110" fill="#0F172A"/>

  <!-- Moldura de QR Code estilizada -->
  <rect x="116" y="90" width="80" height="80" rx="18" fill="none" stroke="url(#pixGrad)" stroke-width="12"/>
  <rect x="136" y="110" width="40" height="40" rx="8" fill="url(#pixGrad)"/>

  <rect x="316" y="90" width="80" height="80" rx="18" fill="none" stroke="url(#pixGrad)" stroke-width="12"/>
  <rect x="336" y="110" width="40" height="40" rx="8" fill="url(#pixGrad)"/>

  <rect x="116" y="290" width="80" height="80" rx="18" fill="none" stroke="url(#pixGrad)" stroke-width="12"/>
  <rect x="136" y="310" width="40" height="40" rx="8" fill="url(#pixGrad)"/>

  <!-- Símbolo Pix no centro -->
  <g transform="translate(256, 230) scale(0.7)" fill="url(#pixGrad)">
    <path d="M0 -50 L35 -15 L0 20 L-35 -15 Z" />
    <path d="M-50 0 L-15 35 L20 0 L-15 -35 Z" />
    <path d="M0 50 L35 15 L0 -20 L-35 15 Z" />
    <path d="M50 0 L15 35 L-20 0 L15 -35 Z" />
  </g>

  <!-- Texto QrPix -->
  <text x="50%" y="430" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="52" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">QrPix</text>
</svg>
